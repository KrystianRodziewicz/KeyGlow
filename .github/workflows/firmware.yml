name: Firmware

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['firmware/keyglow-side.patch', '.github/workflows/firmware.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    steps:
      - uses: actions/checkout@v5
      - name: Kod NuPhy z SignalRGB
        run: |
          git config --global --add safe.directory '*'
          git clone https://github.com/SRGBmods/NuphyQMK.git qmk
          cd qmk
          git checkout 1ef99a7d83c10b747c0aa118540affaf5c5f8af5
          git submodule update --init --recursive
      - name: Biblioteki QMK
        working-directory: qmk
        run: |
          QMK_PY="$(dirname "$(readlink -f "$(command -v qmk)")")/python3"
          if command -v uv >/dev/null; then
            uv pip install --python "$QMK_PY" -r requirements.txt
          else
            "$QMK_PY" -m pip install -r requirements.txt
          fi
          QMK_HOME="$PWD" qmk hello
      - name: Budowanie
        working-directory: qmk
        run: |
          git apply ../firmware/keyglow-side.patch
          export QMK_HOME="$PWD"
          make nuphy/halo75_v2/ansi:via
          cp nuphy_halo75_v2_ansi_via.bin ../keyglow-halo75-v2-ansi.bin
          cd ..
          sha256sum keyglow-halo75-v2-ansi.bin | tee keyglow-halo75-v2-ansi.bin.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            keyglow-halo75-v2-ansi.bin
            keyglow-halo75-v2-ansi.bin.sha256
