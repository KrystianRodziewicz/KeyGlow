<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
  <title>KeyGlow</title>
  <meta name="description" content="Podświetlenie, kolory i funkcje klawiszy NuPhy Halo75 V2 (QMK/VIA).">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="theme-color" content="#131f24">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="kg-rainbow-h" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4b4b"/><stop offset=".25" stop-color="#ffc800"/><stop offset=".5" stop-color="#58cc02"/><stop offset=".75" stop-color="#1cb0f6"/><stop offset="1" stop-color="#ce82ff"/></linearGradient><linearGradient id="kg-rainbow-v" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4b4b"/><stop offset=".25" stop-color="#ffc800"/><stop offset=".5" stop-color="#58cc02"/><stop offset=".75" stop-color="#1cb0f6"/><stop offset="1" stop-color="#ce82ff"/></linearGradient><linearGradient id="kg-rainbow-d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4b4b"/><stop offset=".25" stop-color="#ffc800"/><stop offset=".5" stop-color="#58cc02"/><stop offset=".75" stop-color="#1cb0f6"/><stop offset="1" stop-color="#ce82ff"/></linearGradient><radialGradient id="kg-rainbow-r" cx=".5" cy=".46" r=".62"><stop offset="0" stop-color="#ce82ff"/><stop offset=".3" stop-color="#1cb0f6"/><stop offset=".55" stop-color="#58cc02"/><stop offset=".78" stop-color="#ffc800"/><stop offset="1" stop-color="#ff4b4b"/></radialGradient></defs></svg>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="assets/logo.svg" alt="" width="30" height="30">
        <span class="wordmark">keyglow</span>
      </div>
      <div class="top-right">
        <div class="status" id="status">
          <span class="status-dot"></span>
          <span class="status-icon" id="statusIcon" aria-hidden="true"></span>
          <span id="statusText"></span>
        </div>
        <div class="battery" id="battery" hidden>
          <svg class="battery-icon" viewBox="0 0 28 16" aria-hidden="true">
            <rect x="1" y="1" width="23" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
            <rect x="25" y="5" width="2.5" height="6" rx="1.25" fill="currentColor"/>
            <rect class="battery-fill" x="3.5" y="3.5" width="18" height="9" rx="2"/>
            <path class="battery-bolt" d="M14.5 2.5L9 9h4l-1.5 4.5L17 7h-4z"/>
          </svg>
          <span id="batteryText"></span>
        </div>
        <button type="button" class="install" id="installBtn" data-i18n-label="install.button" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3.5-3.5L8 10l3.5-3.5M3 13.5h10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="install.button"></span>
        </button>
        <div class="theme">
          <button type="button" class="theme-btn" id="themeBtn" aria-haspopup="true" aria-expanded="false" data-i18n-label="theme.button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1.6" fill="#ff4b4b"/><circle cx="10.5" cy="7" r="1.6" fill="#ffc800"/><circle cx="15" cy="7.5" r="1.6" fill="#58cc02"/></svg>
          </button>
          <div class="theme-menu" id="themeMenu" role="menu" hidden></div>
        </div>
        <div class="lang" role="group" aria-label="Język / Language">
          <button type="button" data-lang="pl">PL</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
    </header>

    <main class="main">
      <nav class="modes" id="modes" role="tablist">
        <button type="button" class="mode" data-mode="lighting" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 18.5 12 15.5 7 18.5l1.4-5.7L4 9l5.8-.7z" fill="currentColor"/></svg>
          <span data-i18n="mode.lighting"></span>
        </button>
        <button type="button" class="mode" data-mode="perkey" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5-8.2 8.2a3.5 3.5 0 0 1-2.5 1H5.5v-3.3a3.5 3.5 0 0 1 1-2.5z" fill="currentColor"/><path d="M13 6l5 5" style="stroke: var(--bg)" stroke-width="2" stroke-linecap="round"/></svg>
          <span data-i18n="mode.perkey"></span>
        </button>
        <button type="button" class="mode" data-mode="keymap" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3.5" fill="currentColor"/><path d="M7 10h1.5M11.25 10h1.5M15.5 10H17M8 14h8" style="stroke: var(--bg)" stroke-width="2" stroke-linecap="round"/></svg>
          <span data-i18n="mode.keymap"></span>
        </button>
        <button type="button" class="mode" data-mode="shortcuts" role="tab">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="7" width="8.5" height="10" rx="2.6" fill="currentColor"/><rect x="13" y="7" width="8.5" height="10" rx="2.6" fill="currentColor"/><path d="M5.2 12h3.2M15.6 12h3.4M17.3 10.3v3.4" style="stroke: var(--bg)" stroke-width="1.9" stroke-linecap="round"/></svg>
          <span data-i18n="mode.shortcuts"></span>
        </button>
      </nav>

      <section class="hero">
        <div class="kb-stage" id="kbStage"></div>
        <div class="caption">
          <h1 class="caption-title" id="effectTitle"></h1>
          <p class="caption-sub" id="captionSub">
            <svg class="caption-check" id="captionCheck" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span id="captionText"></span>
          </p>
          <div class="caption-actions">
            <button type="button" class="btn btn-green" id="connectBtn" hidden></button>
            <button type="button" class="btn btn-green" id="saveBtn" hidden></button>
            <button type="button" class="link-btn" id="resetBtn" data-i18n="reset.button" hidden></button>
          </div>
        </div>
      </section>

      <section class="controls" id="panelLighting">
        <div class="card card--effects">
          <svg class="card-art" viewBox="0 0 132 92" aria-hidden="true">
            <path d="M16 80a50 50 0 0 1 100 0" fill="none" stroke="#ff4b4b" stroke-width="8" stroke-linecap="round"/>
            <path d="M27 80a39 39 0 0 1 78 0" fill="none" stroke="#ffc800" stroke-width="8" stroke-linecap="round"/>
            <path d="M38 80a28 28 0 0 1 56 0" fill="none" stroke="#58cc02" stroke-width="8" stroke-linecap="round"/>
            <rect x="42" y="56" width="48" height="34" rx="11" fill="#1899d6"/>
            <rect x="42" y="51" width="48" height="33" rx="11" fill="#1cb0f6"/>
            <rect x="51" y="59" width="15" height="5" rx="2.5" fill="#fff" fill-opacity="0.75"/>
            <path d="M116 10l3.2 7.3 7.3 3.2-7.3 3.2-3.2 7.3-3.2-7.3-7.3-3.2 7.3-3.2z" fill="#ffc800"/>
            <path d="M14 22l2.2 5 5 2.2-5 2.2-2.2 5-2.2-5-5-2.2 5-2.2z" fill="#ce82ff"/>
            <circle cx="102" cy="44" r="3.5" fill="#ff86d0"/>
          </svg>
          <h2 class="card-title" data-i18n="panel.effect"></h2>
          <div class="tabs" id="fxTabs" role="tablist"></div>
          <div class="fx-grid" id="fxList" role="listbox"></div>
        </div>

        <div class="card card--look">
          <svg class="card-art" viewBox="0 0 132 92" aria-hidden="true">
            <path d="M34 14c0 0-19 22-19 37a19 19 0 0 0 38 0c0-15-19-37-19-37z" fill="#ff4b4b"/>
            <path d="M66 4c0 0-21 25-21 41a21 21 0 0 0 42 0C87 29 66 4 66 4z" fill="#ffc800"/>
            <path d="M98 14c0 0-19 22-19 37a19 19 0 0 0 38 0c0-15-19-37-19-37z" fill="#1cb0f6"/>
            <path d="M24 50a10 10 0 0 0 7 9" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
            <path d="M54 44a11 11 0 0 0 8 11" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
            <path d="M88 50a10 10 0 0 0 7 9" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="4" stroke-linecap="round"/>
            <ellipse cx="66" cy="84" rx="44" ry="5" fill="#000" fill-opacity="0.18"/>
            <path d="M122 30l2.6 6 6 2.6-6 2.6-2.6 6-2.6-6-6-2.6 6-2.6z" fill="#58cc02"/>
          </svg>
          <h2 class="card-title" data-i18n="panel.color"></h2>
          <div class="bubbles" id="bubbles" role="radiogroup"></div>
          <div class="slider" id="hueRow" hidden>
            <input type="range" class="bar bar--hue" id="hue" min="0" max="255" step="1" data-i18n-label="panel.hue">
          </div>

          <div class="slider">
            <div class="slider-head">
              <label for="brightness">
                <svg class="slider-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="#ffc800"/><g stroke="#ffc800" stroke-width="2.6" stroke-linecap="round"><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg>
                <span data-i18n="panel.brightness"></span>
              </label>
              <output id="brightnessOut"></output>
            </div>
            <input type="range" class="bar" id="brightness" min="0" max="255" step="1">
          </div>
          <div class="slider" id="speedRow">
            <div class="slider-head">
              <label for="speed">
                <svg class="slider-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2L5 13.2h5.6L9.4 22 19 9.8h-5.8z" fill="#ce82ff" stroke="#a568cc" stroke-width="1.2" stroke-linejoin="round"/></svg>
                <span data-i18n="panel.speed"></span>
              </label>
              <output id="speedOut"></output>
            </div>
            <input type="range" class="bar bar--speed" id="speed" min="0" max="255" step="1">
          </div>

          <div class="side" id="sideRow" hidden>
            <div class="slider-head">
              <span class="side-label">
                <svg class="slider-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="4" fill="none" stroke="#2bd9c5" stroke-width="2.6"/><path d="M7 21h10" stroke="#ff86d0" stroke-width="2.6" stroke-linecap="round"/></svg>
                <span data-i18n="panel.side"></span>
                <span class="side-mode-name" id="sideModeName"></span>
              </span>
              <button type="button" class="chip side-power" id="sidePower"><span></span></button>
            </div>
            <div class="side-controls" id="sideControls">
              <div class="side-modes" id="sideModes" role="radiogroup"></div>
            </div>
            <div class="side-stock" id="sideStock" hidden>
              <div class="side-keys" id="sideStockKeys"></div>
              <button type="button" class="link-btn" id="sideUnlock" data-i18n="side.unlock"></button>
            </div>
            <div class="bubbles bubbles--small side-colours" id="sideColours" role="radiogroup"></div>
            <div class="side-extra" id="sideExtra" hidden>
              <div class="steps"><span data-i18n="side.light"></span><div class="steps-row" id="sideLight"></div></div>
              <div class="steps"><span data-i18n="side.speed"></span><div class="steps-row" id="sideSpeed"></div></div>
            </div>
            <p class="side-hint" id="sideHint"></p>
          </div>
        </div>
      </section>

      <section class="controls" id="panelPerkey" hidden>
        <div class="card card--effects">
          <h2 class="card-title" data-i18n="perkey.pick"></h2>
          <p class="card-hint" data-i18n="perkey.hint"></p>
          <div class="quick" id="pkGroups"></div>
          <p class="card-count" id="pkCount"></p>
        </div>
        <div class="card card--look">
          <h2 class="card-title" data-i18n="perkey.color"></h2>
          <div class="bubbles" id="pkBubbles"></div>
          <div class="slider" id="pkHueRow" hidden>
            <input type="range" class="bar bar--hue" id="pkHue" min="0" max="255" step="1" data-i18n-label="panel.hue">
          </div>
          <div class="pk-actions">
            <button type="button" class="chip" id="pkClear"><span data-i18n="perkey.clear"></span></button>
          </div>
          <div class="side">
            <div class="slider-head"><span class="side-label"><span data-i18n="perkey.base"></span></span></div>
            <div class="bubbles bubbles--small" id="pkBase"></div>
          </div>
        </div>
      </section>

      <section class="controls" id="panelKeymap" hidden>
        <div class="card card--effects">
          <h2 class="card-title" data-i18n="keymap.layer"></h2>
          <div class="tabs" id="kmLayers" role="tablist"></div>
          <div class="km-selected" id="kmSelected"></div>
          <div class="pk-actions">
            <button type="button" class="chip" id="kmRestore"><span data-i18n="keymap.restore"></span></button>
            <button type="button" class="chip" id="kmRestoreAll"><span data-i18n="keymap.restoreAll"></span></button>
          </div>
        </div>
        <div class="card card--look">
          <h2 class="card-title" data-i18n="keymap.function"></h2>
          <div class="tabs" id="kmGroups" role="tablist"></div>
          <div class="fx-grid fx-grid--keys" id="kmCodes"></div>
        </div>
      </section>
      <section class="controls" id="panelShortcuts" hidden>
        <div class="card card--effects">
          <h2 class="card-title" data-i18n="sc.fn"></h2>
          <div class="tabs" id="scLayers" role="tablist"></div>
          <p class="card-hint" id="scSource"></p>
          <div class="sc-list" id="scFn"></div>
        </div>
        <div class="card card--look">
          <h2 class="card-title" data-i18n="sc.side"></h2>
          <div class="sc-list" id="scSide"></div>
          <h2 class="card-title sc-title" data-i18n="sc.other"></h2>
          <div class="sc-list" id="scOther"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
